<ion-content [fullscreen]="true">
  <div id="container" class="ion-text-center">
    <p><strong class="ion-padding">Welcome to Dansteve Adekanbi</strong></p>
    <p><strong class="ion-padding">angular-monnify package testing</strong></p>
    <br />
    <ion-button
      angular-Monnify
      class="ion-no-margin"
      shape="round"
      color="success"
      [monnifyOptions]="options"
      (paymentInit)="paymentInit()"
      (onClose)="paymentCancel($event)"
      (onComplete)="paymentDone($event)"
    >
      Pay
    </ion-button>
  </div>
</ion-content>
